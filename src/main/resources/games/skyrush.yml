# ==============================================================================
# ArvyxCore - Konfigurácia herného režimu SkyRush
# Cieľová dĺžka zápasu: 3 - 5 minút (180 - 300 sekúnd)
# ==============================================================================

skyrush:
  match-duration-seconds: 240
  countdown-seconds: 10
  grace-period-seconds: 10
  supply-drop-interval-seconds: 75
  chest-refill-seconds: 120
  void-y-level: 0.0
  # Radius okolo stredu pre hľadanie ostrovných a centrálnych truhlíc pri dopĺňaní lootu
  chest-scan-radius: 60
  center-radius: 14

  starter-kit:
    - material: "STONE_SWORD"
      amount: 1
    - material: "STONE_PICKAXE"
      amount: 1
    - material: "OAK_PLANKS"
      amount: 24
    - material: "COOKED_BEEF"
      amount: 8

  loot:
    island-min-items: 4
    island-max-items: 7
    center-min-items: 5
    center-max-items: 9
    island-table:
      - material: "IRON_SWORD"
        min: 1
        max: 1
        weight: 18
      - material: "IRON_CHESTPLATE"
        min: 1
        max: 1
        weight: 12
      - material: "IRON_LEGGINGS"
        min: 1
        max: 1
        weight: 12
      - material: "BOW"
        min: 1
        max: 1
        weight: 10
      - material: "ARROW"
        min: 8
        max: 16
        weight: 16
      - material: "OAK_PLANKS"
        min: 16
        max: 32
        weight: 20
      - material: "GOLDEN_APPLE"
        min: 1
        max: 2
        weight: 10
      - material: "SNOWBALL"
        min: 8
        max: 16
        weight: 15
    center-table:
      - material: "DIAMOND_SWORD"
        min: 1
        max: 1
        weight: 14
      - material: "DIAMOND_CHESTPLATE"
        min: 1
        max: 1
        weight: 10
      - material: "DIAMOND_HELMET"
        min: 1
        max: 1
        weight: 12
      - material: "ENDER_PEARL"
