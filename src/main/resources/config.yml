# ==============================================================================
# ArvyxCore 1.1.0 - Hlavná konfigurácia siete ARVYX NETWORK
# DÔLEŽITÉ: Heslá k Redis zadávajte cez premennú prostredia (ARVYX_REDIS_PASSWORD).
# Nikdy sem neukladajte Velocity forwarding secret ani privátne tokeny.
# ==============================================================================

server:
  # Jedinečný identifikátor tohto servera: lobby, skyrush-1, skyrush-2, skyrush-3, chaos-1, chaos-2
  id: "skyrush-1"
  # Rola servera: LOBBY, SKYRUSH, CHAOS, STANDALONE
  role: "SKYRUSH"
  # Zobrazovaný názov servera
  display-name: "SkyRush #1"

network:
  # Názov proxy vrstvy (informatívne, plugin nemení nastavenia Velocity)
  proxy: "velocity"
  # Cieľový lobby server v rámci Velocity siete pre bezpečný návrat hráčov
  lobby-server: "lobby"
  # Interval odosielania heartbeatu a stavu arén (v sekundách)
  heartbeat-interval-seconds: 10
  # Po koľkých sekundách bez heartbeatu sa vzdialený server označí ako nedostupný
  server-timeout-seconds: 30
  # Skutočná Redis Pub/Sub komunikácia medzi lobby a backend servermi
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    ssl: false
    timeout-ms: 2000
    # Názov environment premennej obsahujúcej Redis heslo (prázdne = bez hesla)
    password-env: "ARVYX_REDIS_PASSWORD"
    channel-prefix: "arvyx:network"

lobby:
  # Ak je zapnuté, hráč sa pri návrate do lobby presunie cez Velocity plugin messaging
  use-velocity-transfer: true
  # Lokálny fallback spawn, ak transfer cez proxy nie je dostupný alebo ide o lokálny server
  fallback-spawn:
    world: "world"
    x: 0.5
    y: 65.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

countdown:
  # Predvolený čas odpočítavania pred štartom zápasu (v sekundách)
  default-seconds: 15
  # Sekundy, pri ktorých sa hráčom zobrazí upozornenie a prehrá zvuk
  notify-intervals:
    - 30
    - 15
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1

reset:
  # Čakanie vo fáze ENDING pred začiatkom bezpečného resetu arény (v sekundách)
  ending-delay-seconds: 5
  # Obnoviť inventár, zdravie, hlad a herný mód hráčom pri resete
  restore-player-state: true
  # Odstrániť dočasné herné entity (položené predmety, TNT, šípy)
  clear-temporary-entities: true
  # Obnoviť bloky zmenené hráčmi alebo explóziami počas zápasu
  restore-modified-blocks: true
  # Voliteľná obnova celého sveta zo záložnej šablóny (nikdy nemaže originálny svet bez existujúcej zálohy a povolenia)
  world-backup:
    enabled: false
    allow-world-replacement: false
    backups-dir: "backups"

logging:
  debug: false
