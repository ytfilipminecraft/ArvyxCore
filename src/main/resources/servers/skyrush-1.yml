# Konfigurácia pre backend server: skyrush-1 (port 25571 za Velocity proxy)
server:
  id: "skyrush-1"
  role: "SKYRUSH"
  display-name: "SkyRush #1"

network:
  proxy: "velocity"
  lobby-server: "lobby"
  heartbeat-interval-seconds: 10
  server-timeout-seconds: 30
  redis:
    enabled: true
    host: "127.0.0.1"
    port: 6379
    ssl: false
    timeout-ms: 2000
    password-env: "ARVYX_REDIS_PASSWORD"
    channel-prefix: "arvyx:network"

lobby:
  use-velocity-transfer: true
