name: Build ArvyxCore

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and run tests
        run: ./gradlew --no-daemon clean test build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ArvyxCore-1.1.3
          path: build/libs/ArvyxCore-1.1.3.jar
          if-no-files-found: error
          retention-days: 14
